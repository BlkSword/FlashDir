<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #17181a;
    color: #e8eaed;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 84px;
    position: relative;
  }
  .glow {
    position: absolute; right: -160px; top: -120px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(76,154,255,.20), rgba(76,154,255,0) 68%);
  }
  .mark { flex: 0 0 200px; }
  .mark svg { width: 200px; height: 200px; }
  .main { flex: 1; position: relative; }
  h1 { font-size: 68px; font-weight: 600; letter-spacing: .5px; }
  .sub { margin-top: 10px; font-size: 27px; color: #b9bdc4; }
  .rule { width: 96px; height: 4px; background: #4c9aff; border-radius: 2px; margin: 26px 0 24px; }
  ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 34px; }
  li { font-size: 21px; color: #d5d8dd; display: flex; align-items: center; gap: 12px; }
  li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: #4c9aff; flex: 0 0 8px; }
  .meta { position: absolute; left: 84px; bottom: 46px; font: 19px "Cascadia Mono", Consolas, monospace; color: #8b9098; }
  .badge {
    position: absolute; right: 84px; bottom: 46px; font: 19px "Cascadia Mono", Consolas, monospace;
    color: #cfe3ff; border: 1px solid #2b4a70; background: rgba(43,74,112,.35);
    border-radius: 6px; padding: 6px 14px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4c9aff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6.5h6.2l2 2.4H21v10.6H3z"/>
      <path d="M3 9.2h18"/>
      <path d="M6.6 15.2h5.2M15.4 15.2h2"/>
      <circle cx="14.1" cy="15.2" r="1.7"/>
    </svg>
  </div>
  <div class="main">
    <h1>FlashDir</h1>
    <div class="sub">Windows 磁盘可观测性平台</div>
    <div class="rule"></div>
    <ul>
      <li>NTFS MFT 直读扫描</li>
      <li>USN 增量刷新</li>
      <li>跨卷全局文件检索</li>
      <li>目录体积构成分析</li>
      <li>快照对比与体积趋势</li>
      <li>重复文件与开发缓存</li>
      <li>MCP 接入（13 个工具）</li>
      <li>只读、可解释、键盘优先</li>
    </ul>
  </div>
  <div class="meta">Rust · Tauri 2 · Vue 3 · SQLite</div>
  <div class="badge">v3.5.0 · Apache-2.0</div>
</body>
</html>
