[package]
name = "flashdir"
version = "3.4.2"
edition = "2021"
description = "FlashDir - Disk observability platform for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# MCP 服务器（stdio / 本机端点 / 桥接）；不默认开启以免影响 lib 单测链接
mcp = []
# 生产构建必须启用（Tauri 模板标准做法）：
# tauri 用该 feature 判定 dev/prod —— 未启用时 generate_context! 会走 dev 分支，
# 只嵌入 devUrl(localhost:5173) 而不嵌入 frontendDist，运行时会显示
# "localhost 拒绝连接"。
# 构建方式：cargo build --release --features custom-protocol
# 或直接用 Tauri CLI：npm run tauri:build
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rayon = "1.10"
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
lru = "0.12"
num_cpus = "1.16"
mimalloc = "0.1"
parking_lot = "0.12"
smartstring = { version = "1.0", features = ["serde"] }
bincode = "1.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
rusqlite = { version = "0.30", features = ["bundled", "blob"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 使用 thin LTO：速度接近 fat（90%+），但链接速度提升 5-10 倍
lto = "thin"
# 并行代码生成单元：充分利用多核，大幅缩短编译时间
codegen-units = 16
opt-level = 3
strip = true
panic = "abort"
overflow-checks = false
debug-assertions = false

[[bin]]
name = "flashdir-mcp"
path = "src/bin/flashdir-mcp.rs"
required-features = ["mcp"]
